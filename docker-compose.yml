services:
  copilot:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: sqlite:////app/data/app.db
      FEISHU_WEBHOOK_URL: ${FEISHU_WEBHOOK_URL:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - copilot
    restart: unless-stopped
