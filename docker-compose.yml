services:
  copilot:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: sqlite:////app/data/app.db
      LLM_PROVIDER: ${LLM_PROVIDER:-disabled}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_REQUEST_TIMEOUT_SECONDS: ${LLM_REQUEST_TIMEOUT_SECONDS:-10}
      FEISHU_WEBHOOK_URL: ${FEISHU_WEBHOOK_URL:-}
      REDIS_URL: ${REDIS_URL:-}
      REDIS_CONNECT_TIMEOUT_SECONDS: ${REDIS_CONNECT_TIMEOUT_SECONDS:-1}
      COPILOT_RATE_LIMIT_CAPACITY: ${COPILOT_RATE_LIMIT_CAPACITY:-10}
      COPILOT_RATE_LIMIT_WINDOW_SECONDS: ${COPILOT_RATE_LIMIT_WINDOW_SECONDS:-60}
      DASHBOARD_CACHE_TTL_SECONDS: ${DASHBOARD_CACHE_TTL_SECONDS:-60}
      RAG_CACHE_TTL_SECONDS: ${RAG_CACHE_TTL_SECONDS:-300}
      SESSION_CONTEXT_TTL_SECONDS: ${SESSION_CONTEXT_TTL_SECONDS:-1800}
      SESSION_CONTEXT_MAX_MESSAGES: ${SESSION_CONTEXT_MAX_MESSAGES:-10}
      RAG_KNOWLEDGE_VERSION: ${RAG_KNOWLEDGE_VERSION:-v1}
      RAG_RULE_VERSION: ${RAG_RULE_VERSION:-v1}
      RAG_QUERY_REWRITE_PROMPT_VERSION: ${RAG_QUERY_REWRITE_PROMPT_VERSION:-v1}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - copilot
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
